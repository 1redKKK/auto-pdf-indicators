[pytest]
# pytest-asyncio: 'auto' = любая async-функция автоматически считается asyncio-тестом,
# не нужно ставить @pytest.mark.asyncio на каждый тест/фикстуру.
asyncio_mode = auto

# Явно задаём scope event-loop для async-фикстур — убирает
# PytestDeprecationWarning и фиксирует поведение под будущие версии pytest-asyncio.
asyncio_default_fixture_loop_scope = function

# Автосборка отчёта о покрытии для пакета `app`. Term-summary в консоли и
# HTML-отчёт в htmlcov/ (gitignore). Запускается одной командой `pytest`.
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html

testpaths = tests
